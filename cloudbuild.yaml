# Google Cloud Build configuration
steps:
  # Build Backend Docker image
  - name: 'gcr.io/cloud-builders/docker'
    args:
      - 'build'
      - '-t'
      - 'gcr.io/$PROJECT_ID/aureum-backend:$SHORT_SHA'
      - '-t'
      - 'gcr.io/$PROJECT_ID/aureum-backend:latest'
      - '-f'
      - 'backend/Dockerfile'
      - './backend'
    id: 'build-backend'

  # Build Frontend Docker image
  - name: 'gcr.io/cloud-builders/docker'
    args:
      - 'build'
      - '-t'
      - 'gcr.io/$PROJECT_ID/aureum-frontend:$SHORT_SHA'
      - '-t'
      - 'gcr.io/$PROJECT_ID/aureum-frontend:latest'
      - '-f'
      - 'frontend/Dockerfile'
      - './frontend'
    id: 'build-frontend'

  # Push Backend image to Container Registry
  - name: 'gcr.io/cloud-builders/docker'
    args:
      - 'push'
      - 'gcr.io/$PROJECT_ID/aureum-backend:$SHORT_SHA'
    id: 'push-backend'
    waitFor: ['build-backend']

  # Push Frontend image to Container Registry
  - name: 'gcr.io/cloud-builders/docker'
    args:
      - 'push'
      - 'gcr.io/$PROJECT_ID/aureum-frontend:$SHORT_SHA'
    id: 'push-frontend'
    waitFor: ['build-frontend']

  # Deploy Backend to Cloud Run
  - name: 'gcr.io/cloud-builders/gcloud'
    args:
      - 'run'
      - 'deploy'
      - 'aureum-backend'
      - '--image=gcr.io/$PROJECT_ID/aureum-backend:$SHORT_SHA'
      - '--region=europe-west1'
      - '--platform=managed'
      - '--allow-unauthenticated'
      - '--set-env-vars=^|^MONGO_URL=${_MONGO_URL}|DB_NAME=${_DB_NAME}|CORS_ORIGINS=${_CORS_ORIGINS}|SMTP_EMAIL=${_SMTP_EMAIL}|SMTP_PASSWORD=${_SMTP_PASSWORD}|CONTACT_TO_EMAIL=${_CONTACT_TO_EMAIL}'
      - '--memory=512Mi'
      - '--cpu=1'
      - '--max-instances=10'
      - '--min-instances=0'
    id: 'deploy-backend'
    waitFor: ['push-backend']

  # Deploy Frontend to Cloud Run
  - name: 'gcr.io/cloud-builders/gcloud'
    args:
      - 'run'
      - 'deploy'
      - 'aureum-frontend'
      - '--image=gcr.io/$PROJECT_ID/aureum-frontend:$SHORT_SHA'
      - '--region=europe-west1'
      - '--platform=managed'
      - '--allow-unauthenticated'
      - '--memory=256Mi'
      - '--cpu=1'
      - '--max-instances=10'
      - '--min-instances=0'
    id: 'deploy-frontend'
    waitFor: ['push-frontend']

images:
  - 'gcr.io/$PROJECT_ID/aureum-backend:$SHORT_SHA'
  - 'gcr.io/$PROJECT_ID/aureum-backend:latest'
  - 'gcr.io/$PROJECT_ID/aureum-frontend:$SHORT_SHA'
  - 'gcr.io/$PROJECT_ID/aureum-frontend:latest'

timeout: '1800s'

substitutions:
  _MONGO_URL: 'mongodb+srv://user:password@cluster.mongodb.net'
  _DB_NAME: 'aureum_digital_prod'
  _CORS_ORIGINS: 'https://aureumdigital.com'
  _SMTP_EMAIL: ''
  _SMTP_PASSWORD: ''
  _CONTACT_TO_EMAIL: ''
